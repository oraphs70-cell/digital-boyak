  <style>
    /* 로딩 스플래시 */
    #loading-splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #FF9A6C 0%, #FF7F50 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    #loading-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      margin-top: 20px;
      color: white;
      font-size: 18px;
      font-weight: 600;
    }
  </style>

    <p class="loading-text">디지털 보약 로딩중...</p>
  </div>

  <div id="root"></div>

  <script>
    // 앱 로딩 완료 시 스플래시 숨김
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.getElementById('loading-splash').classList.add('hidden');
      }, 500);
    });
