<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 약탕기 뚜껑 -->
  <rect x="20" y="20" width="60" height="10" rx="5" fill="#D97706"/>
  <!-- 손잡이 -->
  <circle cx="50" cy="15" r="8" fill="#92400E"/>
  <!-- 약탕기 몸체 -->
  <rect x="15" y="30" width="70" height="55" rx="15" fill="url(#bodyGrad)"/>
  <!-- 연기 -->
  <ellipse cx="35" cy="8" rx="6" ry="4" fill="#FEF3C7" opacity="0.6"/>
  <ellipse cx="50" cy="5" rx="5" ry="3" fill="#FEF3C7" opacity="0.5"/>
  <ellipse cx="65" cy="8" rx="6" ry="4" fill="#FEF3C7" opacity="0.6"/>
  <!-- 눈 -->
  <circle cx="35" cy="52" r="6" fill="#1F2937"/>
  <circle cx="65" cy="52" r="6" fill="#1F2937"/>
  <circle cx="37" cy="50" r="2" fill="white"/>
  <circle cx="67" cy="50" r="2" fill="white"/>
  <!-- 볼 -->
  <ellipse cx="25" cy="62" rx="8" ry="4" fill="#FDBA74" opacity="0.6"/>
  <ellipse cx="75" cy="62" rx="8" ry="4" fill="#FDBA74" opacity="0.6"/>
  <!-- 입 -->
  <path d="M 40 68 Q 50 78 60 68" stroke="#1F2937" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 그라디언트 정의 -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
  </defs>
</svg>
